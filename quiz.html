<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Another Life Quiz</title>
    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <div class="quiz-container">

        <div id="quiz-screen">
            <h2 id="question-text">Question loading...</h2>
            <div id="options-container"></div>
        </div>

        <div id="result-screen" class="hidden">
            <h2>Your Result:</h2>

            <h1 id="result-title"></h1>

            <p id="result-desc"></p>

            <img id="result-image" alt="Artist Profile" src="">

            <div class="result-buttons">
                <button id="restart-btn" class="option-btn">
                    Take Quiz Again
                </button>

                <button id="home-btn" class="option-btn">
                    Back to Home
                </button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
